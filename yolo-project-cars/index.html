<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jeep vs Tesla</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .sample {
        width: 96px;
        padding: 0;
        border: 2px solid transparent;
        background: #fff;
      }
      .sample img {
        width: 92px;
        height: 68px;
        object-fit: cover;
        display: block;
      }
      .sample.active {
        border-color: #2563eb;
      }
      #gallery {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 8px;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container py-5" style="max-width: 900px">
      <h1 class="h3 mb-2 text-center">Jeep vs Tesla</h1>
      <p class="text-muted text-center mb-4">Click a dataset photo. It is already on this machine.</p>

      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <div id="gallery" class="mb-3"></div>
          <input type="file" id="file" accept="image/*" class="form-control mb-3" />
          <div id="status" class="text-muted small mb-3">Click a photo to start</div>
          <canvas id="canvas" class="img-fluid rounded border"></canvas>
        </div>
      </div>
    </div>

    <script>
      const API =
        location.protocol === "http:" || location.protocol === "https:"
          ? location.origin
          : "http://127.0.0.1:8001";
      const fileInput = document.getElementById("file");
      const canvas = document.getElementById("canvas");
      const statusEl = document.getElementById("status");
      const gallery = document.getElementById("gallery");
      const ctx = canvas.getContext("2d");

      function drawBoxes(img, boxes) {
        ctx.lineWidth = Math.max(2, img.width / 300);
        ctx.font = `${Math.max(16, img.width / 40)}px sans-serif`;
        ctx.textBaseline = "top";
        for (const b of boxes) {
          const [x1, y1, x2, y2] = b.box;
          const label = `${b.class} ${b.conf.toFixed(2)}`;
          ctx.strokeStyle = "#00e676";
          ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
          const tw = ctx.measureText(label).width;
          const th = parseInt(ctx.font, 10);
          ctx.fillStyle = "#00e676";
          ctx.fillRect(x1, y1, tw + 8, th + 6);
          ctx.fillStyle = "#000";
          ctx.fillText(label, x1 + 4, y1 + 3);
        }
        statusEl.textContent = `Found ${boxes.length} object(s)`;
      }

      async function showImage(src) {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = src;
        await img.decode();
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        return img;
      }

      async function detectSample(item, button) {
        document.querySelectorAll(".sample").forEach((el) => el.classList.remove("active"));
        button.classList.add("active");
        statusEl.textContent = "Detecting...";
        const img = await showImage(API + item.url);
        const res = await fetch(`${API}/samples/${item.split}/${item.name}/predict`, { method: "POST" });
        const boxes = await res.json();
        drawBoxes(img, boxes);
      }

      async function loadGallery() {
        const res = await fetch(API + "/samples");
        const items = await res.json();
        gallery.replaceChildren();
        for (const item of items) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "sample rounded";
          button.title = `${item.split}: ${item.name}`;
          const thumb = document.createElement("img");
          thumb.src = API + item.url;
          thumb.alt = item.name;
          button.appendChild(thumb);
          button.addEventListener("click", () => detectSample(item, button));
          gallery.appendChild(button);
        }
      }

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files[0];
        if (!file) return;
        document.querySelectorAll(".sample").forEach((el) => el.classList.remove("active"));
        statusEl.textContent = "Detecting...";
        const img = await showImage(URL.createObjectURL(file));
        const form = new FormData();
        form.append("file", file);
        const res = await fetch(API + "/predict", { method: "POST", body: form });
        const boxes = await res.json();
        drawBoxes(img, boxes);
      });

      loadGallery();
    </script>
  </body>
</html>
